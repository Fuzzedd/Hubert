<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Multiplayer Playground</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Roblox-style Chat Overlay in Top-Left Corner */
    #chat-container {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 320px;
      max-height: 240px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
      pointer-events: auto;
      backdrop-filter: blur(4px);
      z-index: 100;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      max-height: 170px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.3) transparent;
    }

    #chat-messages::-webkit-scrollbar {
      width: 4px;
    }
    #chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
    }

    .chat-msg {
      font-size: 13px;
      line-height: 1.4;
      color: #ffffff;
      word-wrap: break-word;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .chat-msg .sender {
      font-weight: bold;
      color: #55ffff;
    }

    #chat-input-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: #ffffff;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }

    #chat-input-box:focus {
      border-color: #55ffff;
      background: rgba(0, 0, 0, 0.8);
    }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div id="chat-container">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input-box" placeholder="Press Enter or click here to chat..." autocomplete="off" />
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
