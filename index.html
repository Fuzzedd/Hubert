<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Multiplayer Playground</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Main Menu Overlay */
    #menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .menu-card {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      width: 320px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .menu-card h1 {
      color: #ffffff;
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .menu-card input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.6);
      color: #ffffff;
      font-size: 15px;
      outline: none;
      box-sizing: border-box;
      text-align: center;
    }

    .menu-card input:focus {
      border-color: #38bdf8;
    }

    .menu-card button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .menu-card button:hover {
      background: #0369a1;
    }

    /* Roblox Chat Overlay */
    #chat-container {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 300px;
      max-height: 220px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      display: none; /* Shown after main menu */
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
      pointer-events: auto;
      backdrop-filter: blur(4px);
      z-index: 100;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      max-height: 150px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.3) transparent;
    }

    .chat-msg {
      font-size: 13px;
      line-height: 1.4;
      color: #ffffff;
      word-wrap: break-word;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .chat-msg .sender {
      font-weight: bold;
      color: #38bdf8;
    }

    #chat-input-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: #ffffff;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      box-sizing: border-box;
    }

    #chat-input-box:focus {
      border-color: #38bdf8;
      background: rgba(0, 0, 0, 0.8);
    }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- Main Menu Overlay -->
  <div id="menu-overlay">
    <div class="menu-card">
      <h1>3D Playground</h1>
      <input type="text" id="username-input" placeholder="Enter your name..." maxlength="15" autocomplete="off" />
      <button id="play-btn">PLAY</button>
    </div>
  </div>

  <!-- Chat HUD -->
  <div id="chat-container">
    <div id="chat-messages"></div>
    <input type="text" id="chat-input-box" placeholder="Press / or Enter to chat..." autocomplete="off" />
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
